name: Build and test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - env:
          # @konraddevoak/* live in KonradDevOak's private GitHub Packages registry (published from
          # the Sandbox repo); the default GITHUB_TOKEN cannot read another repo's packages, so a
          # read:packages PAT is required. Consumed via the committed .npmrc.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: npm ci
      - run: npm run lint
      - run: npm run build
