<ion-content [fullscreen]="true" class="login-content">
  <div class="terminal">
    <div class="terminal-line">
      <span class="word-white">{{ displayTextFirstWord }}</span><span class="word-grey">{{ displayTextSecondWord }}</span><span
        class="cursor"
        *ngIf="showCursor"
      ></span>
    </div>

    <div class="login-action" [class.visible]="showLoginAction">
      <button class="crt-button" (click)="onLogin()" [disabled]="isLoading">
        <ion-spinner name="lines-small" *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Zaloguj się / Zarejestruj się</span>
      </button>

      <p class="error-text" *ngIf="isLoginFailed">&gt; błąd: {{ errorMessage }}</p>
    </div>
  </div>

  <div class="footer-brand">LocalBiz</div>
</ion-content>
