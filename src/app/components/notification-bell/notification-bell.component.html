<button
  type="button"
  class="bell"
  [attr.aria-label]="'notifications.bell.toggle' | translate"
  (click)="toggle($event)"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path
      fill="currentColor"
      d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2zm-2 1H7v-6a5 5 0 0 1 10 0v6z"
    />
  </svg>
  @if (unreadCount() > 0) {
    <span class="bell__badge">{{ unreadCount() }}</span>
  }
</button>

<ion-popover class="bell-popover" [isOpen]="open()" [event]="openEvent()" [dismissOnSelect]="false" (didDismiss)="dismiss()">
  <ng-template>
    <div class="bell-panel">
      <div class="bell-panel__head">
        <span class="bell-panel__title">{{ 'notifications.bell.title' | translate }}</span>
        @if (unreadCount() > 0) {
          <button type="button" class="bell-panel__action" (click)="markAllRead()">
            {{ 'notifications.bell.markAllRead' | translate }}
          </button>
        }
      </div>

      @if (items().length === 0) {
        <p class="bell-panel__empty muted">{{ 'notifications.bell.empty' | translate }}</p>
      } @else {
        <ul class="bell-panel__list">
          @for (item of items(); track item.id) {
            <li>
              <button
                type="button"
                class="bell-item"
                [class.bell-item--unread]="!item.readAt"
                (click)="markRead(item.id)"
              >
                <span class="bell-item__subject">{{ item.subject }}</span>
                <span class="bell-item__body muted">{{ item.body }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </ng-template>
</ion-popover>
