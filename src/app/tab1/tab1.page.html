<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-container">
    <ion-card class="profile-card">
      <ion-card-content>
        <div class="profile-header">
          <ion-avatar class="profile-avatar">
            <div class="avatar-initials">{{ getUserInitials() }}</div>
          </ion-avatar>
          <div class="profile-info">
            <h1>{{ getUserDisplayName() }}</h1>
            <p>{{ getUserEmail() }}</p>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card class="theme-card">
      <ion-card-content>
        <ion-label class="theme-label">Motyw</ion-label>
        <ion-segment [value]="themePreference" (ionChange)="onThemeChange($event)">
          <ion-segment-button value="light">
            <ion-label>Jasny</ion-label>
          </ion-segment-button>
          <ion-segment-button value="dark">
            <ion-label>Ciemny</ion-label>
          </ion-segment-button>
          <ion-segment-button value="system">
            <ion-label>Systemowy</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-card-content>
    </ion-card>

    <ion-card class="menu-card">
      <ion-list>
        <ion-item button="true" (click)="logout()" class="logout-item">
          <ion-icon
            name="log-out-outline"
            slot="start"
            color="danger"
          ></ion-icon>
          <ion-label color="danger">Wyloguj się</ion-label>
        </ion-item>
      </ion-list>
    </ion-card>
  </div>
</ion-content>
