<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Zgody</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="ion-text-center" *ngIf="isLoading">
    <ion-spinner></ion-spinner>
  </div>

  <ng-container *ngIf="!isLoading">
    <ion-text color="medium">
      <p>Zanim będziesz mógł kontynuować, zaakceptuj poniższe dokumenty.</p>
    </ion-text>

    <ion-list *ngIf="pendingConsents.length > 0">
      <ion-item *ngFor="let consent of pendingConsents">
        <ion-icon name="document-text-outline" slot="start"></ion-icon>
        <ion-label class="ion-text-wrap">
          <h2>{{ consent.versionLabel }}</h2>
          <p (click)="openContent(consent.contentUrl)">
            Zobacz treść <ion-icon name="open-outline"></ion-icon>
          </p>
        </ion-label>
        <ion-button
          *ngIf="!isAccepted(consent.documentType)"
          slot="end"
          (click)="accept(consent)"
        >
          Akceptuję
        </ion-button>
        <ion-icon *ngIf="isAccepted(consent.documentType)" slot="end" name="checkmark-circle-outline" color="success"></ion-icon>
      </ion-item>
    </ion-list>

    <div class="empty-state" *ngIf="pendingConsents.length === 0">
      <ion-text color="medium">
        <p>Nie ma żadnych oczekujących zgód.</p>
      </ion-text>
    </div>

    <ion-button
      expand="block"
      class="ion-margin-top"
      [disabled]="(pendingConsents.length > 0 && !allAccepted) || isSubmitting"
      (click)="continue()"
    >
      Kontynuuj
    </ion-button>
  </ng-container>
</ion-content>
