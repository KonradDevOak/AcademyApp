<div class="child-photo">
  <span class="child-photo__avatar">
    @if (showPhoto()) {
      <img [src]="photoUrl()" [alt]="'academy.childPhoto.alt' | translate" (error)="onImageError()" />
    } @else {
      <span class="child-photo__initials" aria-hidden="true">{{ initials() }}</span>
    }
  </span>

  <div class="child-photo__body">
    <div class="child-photo__actions">
      <label class="btn" [class.is-disabled]="busy()">
        {{ (showPhoto() ? 'academy.childPhoto.change' : 'academy.childPhoto.add') | translate }}
        <input
          type="file"
          class="child-photo__input"
          [accept]="acceptAttr"
          [disabled]="busy()"
          (change)="onFileSelected($event)"
        />
      </label>
      @if (showPhoto()) {
        <button type="button" class="btn btn--ghost" [disabled]="busy()" (click)="remove()">
          {{ 'academy.childPhoto.remove' | translate }}
        </button>
      }
      <button
        type="button"
        class="child-photo__info"
        [attr.aria-expanded]="noteOpen()"
        [attr.aria-label]="'academy.childPhoto.noteLabel' | translate"
        (click)="noteOpen.set(!noteOpen())"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      </button>
    </div>

    @if (noteOpen()) {
      <p class="child-photo__note muted" role="note">{{ 'academy.childPhoto.note' | translate }}</p>
    }

    @if (busy()) {
      <p class="muted" role="status">{{ 'academy.childPhoto.saving' | translate }}</p>
    }
    @if (errorKey(); as key) {
      <p class="banner banner--error" role="alert">{{ key | translate }}</p>
    }
  </div>
</div>
